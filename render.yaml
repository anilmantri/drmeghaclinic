# Render Blueprint — deploys the clinic site, the skin-scan backend, and its
# database together. See README.md for the full walkthrough.
#
# Usage: push this repo to GitHub, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at the repo. Render reads this file
# and provisions everything below automatically.

databases:
  - name: drmegha-leads
   # plan: free
    databaseName: drmegha_leads
    user: drmegha

services:
  # Backend: AI skin analysis + lead capture API
  - type: web
    name: drmegha-skinscan-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # set manually in the dashboard — never commit secrets
      - key: WEB3FORMS_KEY
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://YOUR-SITE.onrender.com   # update after the static site is live
      - key: DATABASE_URL
        fromDatabase:
          name: drmegha-leads
          property: connectionString

  # Frontend: the clinic's static site (index.html)
  - type: web
    name: drmegha-site
    runtime: static
    plan: free
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
